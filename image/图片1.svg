<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50" />
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e67e22" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#f8f9fa" rx="12" />

  <text x="460" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">ATE 系统示意图</text>

  <!-- 用户（浏览器） -->
  <rect x="40" y="250" width="180" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text x="130" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">用户（浏览器）</text>
  <text x="130" y="315" text-anchor="middle" font-size="13" fill="#1e40af">方案/项目配置</text>

  <!-- ATE服务器 -->
  <rect x="300" y="100" width="200" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="400" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">ATE 服务器</text>
  <text x="400" y="165" text-anchor="middle" font-size="13" fill="#166534">保存方案、项目与测试数据</text>

  <!-- ATEBOX -->
  <rect x="620" y="250" width="180" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="710" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="#78350f">ATEBOX</text>
  <text x="710" y="315" text-anchor="middle" font-size="13" fill="#92400e">接收并执行测试流程</text>

  <!-- 测量设备 -->
  <rect x="280" y="470" width="200" height="80" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2" />
  <text x="380" y="505" text-anchor="middle" font-size="17" font-weight="bold" fill="#831843">测量设备</text>
  <text x="380" y="530" text-anchor="middle" font-size="12" fill="#9d174d">万用表、示波器等</text>

  <!-- 被测仪器 -->
  <rect x="620" y="470" width="200" height="80" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" />
  <text x="720" y="505" text-anchor="middle" font-size="17" font-weight="bold" fill="#312e81">被测仪器</text>
  <text x="720" y="530" text-anchor="middle" font-size="12" fill="#3730a3">被测试的产品/设备</text>

  <!-- 控制流程箭头 -->
  <path d="M220,280 L220,145 L300,145" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="#2c3e50" stroke="#f8f9fa" stroke-width="4" paint-order="stroke">保存方案/项目</text>

  <path d="M500,145 L560,145 L560,295 L620,295" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="575" y="195" text-anchor="middle" font-size="12" fill="#2c3e50" stroke="#f8f9fa" stroke-width="4" paint-order="stroke">下发测试流程</text>

  <path d="M740,340 L740,470" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="755" y="405" text-anchor="middle" font-size="12" fill="#2c3e50" stroke="#f8f9fa" stroke-width="4" paint-order="stroke">控制</text>

  <path d="M680,340 L680,405 L380,405 L380,470" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="530" y="395" text-anchor="middle" font-size="12" fill="#2c3e50" stroke="#f8f9fa" stroke-width="4" paint-order="stroke">网口/串口控制</text>

  <!-- 数据回传与报告导出箭头（虚线） -->
  <path d="M420,470 L420,445 L680,445 L680,340" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)" />
  <text x="550" y="435" text-anchor="middle" font-size="12" fill="#b45309" stroke="#f8f9fa" stroke-width="4" paint-order="stroke">测试数据回传</text>

  <path d="M620,315 L560,315 L560,175 L500,175" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)" />
  <text x="575" y="295" text-anchor="middle" font-size="12" fill="#b45309" stroke="#f8f9fa" stroke-width="4" paint-order="stroke">数据保存</text>

  <path d="M300,175 L260,175 L260,325 L220,325" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)" />
  <text x="270" y="250" text-anchor="middle" font-size="12" fill="#b45309" stroke="#f8f9fa" stroke-width="4" paint-order="stroke">导出报告</text>
</svg>
